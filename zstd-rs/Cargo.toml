[package]
name = "zstd-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust, no_std, wasm32-ready Zstandard (RFC 8878) compressor and decompressor with dictionary support; interoperates with the reference C zstd in both directions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Avarok-Cybersecurity/zstd-rs"
readme = "README.md"
keywords = ["zstd", "zstandard", "compression", "no_std", "wasm"]
categories = ["compression", "no-std", "wasm", "encoding"]
exclude = ["fuzz/"]

[lib]
name = "zstd_rs"

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
