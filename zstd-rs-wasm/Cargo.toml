[package]
name = "zstd-rs-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "wasm32-unknown-unknown bindings (raw ABI, no imports) for zstd-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Avarok-Cybersecurity/zstd-rs"
readme = "README.md"
keywords = ["zstd", "compression", "wasm"]
categories = ["compression", "wasm"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zstd-rs = { version = "0.1.0", path = "../zstd-rs" }
